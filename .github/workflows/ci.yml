name: Reader checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reader-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reader:
    name: ${{ matrix.edition }} edition
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        edition: [odyssey, starter]
    env:
      READER_EDITION: editions/${{ matrix.edition }}/edition.json
      READER_TEST_EDITION: ${{ matrix.edition }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate:content
      - run: npm run test:unit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
